server {
    listen 80;
    server_name localhost; # Replace with your domain in production

    # 1. Route to Django API
    location ~* ^/(api|gauth|admin){
        # 'django_api' is the service name from docker-compose.yml
        proxy_pass http://django_api:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1b. Serve Django's collected static files (admin, DRF browsable API, etc.)
    #     directly from the shared volume that `collectstatic` writes to.
    #     This block must come before the `/` catch-all so it takes priority.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    # 2. Route to Flask Web App
    location / {
        # 'flask_web' is the service name from docker-compose.yml
        proxy_pass http://flask_web:5000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}